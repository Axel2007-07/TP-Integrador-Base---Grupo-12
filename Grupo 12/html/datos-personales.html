<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Grupo 12/css/estilos-datos-personales.css">
    <title>Datos personales</title>
</head>
<body>
    <header></header>
    <main class="main-content">
        <div class="form-wrapper">
            <h1 class="titulo-principal">Mi Cuenta y Datos Personales</h1>
            <hr>
            
            <form action="#" method="post" class="main-form">
                
                <fieldset class="form-section">
                    <legend>Datos de Acceso</legend>

                    <div class="field-group field-group-horizontal">
                        <div class="field-unit">
                            <label for="email">Email principal</label> 
                            <input type="email" name="email" id="email" placeholder="@gmail.com" required>
                        </div>
                        <button type="submit" class="btn-small">Modificar </button>
                    </div>

                    <div class="field-group field-group-horizontal">
                        <div class="field-unit">
                            <label for="contrasena">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena" placeholder="*********" required>
                        </div>
                        <button type="submit" class="btn-small">Modificar </button>     
                    </div>
                </fieldset>
                
                <hr>
                
                <fieldset class="form-section">
                    <legend>Información Personal</legend>

                    <div class="field-group field-group-grid-2">
                        <div class="field-unit">
                            <label for="Nombre">Nombre</label>
                            <input type="text" name="Nombre" id="Nombre" required> 
                        </div>
                        <div class="field-unit">
                            <label for="Apellido">Apellido</label>
                            <input type="text" name="Apellido" id="Apellido" required>
                        </div>
                    </div>

                    <div class="field-group field-group-grid-3">
                        <div class="field-unit">
                            <label for="Tipo">Tipo Doc.</label>
                            <input type="text" name="Tipo" id="Tipo" required> 
                        </div>
                        <div class="field-unit">
                            <label for="NumeroDocumento">Número de documento</label>
                            <input type="number" name="NumeroDocumento" id="NumeroDocumento" required> 
                        </div>
                        <div class="field-unit">
                            <label for="fechaNacimiento">Fecha de nacimiento</label>
                            <input type="date" name="fechaNacimiento" id="fechaNacimiento" required>
                        </div>
                    </div>

                    <div class="field-group field-group-grid-2">
                        <div class="field-unit">
                            <label for="Telefono">Teléfono</label>
                            <input type="tel" name="Telefono" id="Telefono">
                        </div>
                        <div class="field-unit">
                            <label for="EmailSecundario">Email secundario</label>
                            <input type="email" name="EmailSecundario" id="EmailSecundario">
                        </div>
                    </div>
                </fieldset>

                <button type="submit" class="btn-submit">Guardar cambios</button>
            </form>
        </div>
    </main>
    <footer></footer>
</body>
</html>
